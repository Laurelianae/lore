name: Publish loreserver image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release:
        description: Published aidonia-v release to package or retry
        type: string
        required: true

permissions: {}
# Serialize publications so an older run cannot race a newer moving tag.
concurrency:
  group: publish-loreserver-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/laurelianae/lore/loreserver
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  meta:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'aidonia-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      fork_version: ${{ steps.meta.outputs.fork_version }}
      source_commit: ${{ steps.meta.outputs.source_commit }}
      existing_digest: ${{ steps.existing.outputs.digest }}
    steps:
      - name: Restrict manual publication to the default branch
        if: github.event_name == 'workflow_dispatch'
        env:
          REF: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: test "$REF" = "$DEFAULT_BRANCH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release || github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - id: meta
        env:
          TAG: ${{ inputs.release || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh api "repos/{owner}/{repo}/releases/tags/$TAG" > release-info.json
          gh release download "$TAG" --pattern release-manifest.json --pattern SHA256SUMS --dir release-assets
          python3 scripts/release/release.py metadata --tag "$TAG" --published-manifest release-assets/release-manifest.json --github-output "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import json
          release = json.load(open('release-info.json'))
          context = json.load(open('release-context.json'))
          assert not release['draft'], 'release must be published first'
          assert release['tag_name'] == context['tag'], 'release tag mismatch'
          assert release['prerelease'] == context['prerelease'], 'prerelease flag must match the tag'
          assert release.get('immutable'), 'enable release immutability before publishing the draft'
          PY
          python3 scripts/release/release.py verify --directory release-assets
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: existing
        env:
          VERSION: ${{ steps.meta.outputs.fork_version }}
        run: |
          digest=$(bash scripts/release/image-digest.sh "$IMAGE:$VERSION")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-release-context
          path: release-context.json
          if-no-files-found: error

  build:
    needs: meta
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, arch: amd64, target: x86_64-unknown-linux-gnu}
          - {os: ubuntu-24.04-arm, arch: arm64, target: aarch64-unknown-linux-gnu}
    env:
      TAG: ${{ needs.meta.outputs.tag }}
      VERSION: ${{ needs.meta.outputs.fork_version }}
      ARCH: ${{ matrix.arch }}
      TARGET: ${{ matrix.target }}
      EXISTING_DIGEST: ${{ needs.meta.outputs.existing_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.source_commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-release-context
      - name: Download and verify released binaries
        id: assets
        run: |
          set -euo pipefail
          gh release download "$TAG" --dir release-assets --pattern release-manifest.json --pattern SHA256SUMS \
            --pattern "lore-v$VERSION-$TARGET.tar.gz" --pattern "loreserver-v$VERSION-$TARGET.tar.gz"
          python3 scripts/release/release.py extract --directory release-assets --binary loreserver --target "$TARGET" --destination "dist/$ARCH"
          python3 scripts/release/release.py extract --directory release-assets --binary lore --target "$TARGET" --destination "clients/$ARCH"
          echo "server_sha256=$(sha256sum "release-assets/loreserver-v$VERSION-$TARGET.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        if: needs.meta.outputs.existing_digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: lore-server/Dockerfile.release
          platforms: linux/${{ matrix.arch }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.meta.outputs.source_commit }}
            org.opencontainers.image.version=${{ needs.meta.outputs.fork_version }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.description=Aidonia Lore fork server
            io.aidonia.lore.server-archive.sha256=${{ steps.assets.outputs.server_sha256 }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.30"
          python-version: "3.13"
      - name: Test the native image, both transports, and persisted data
        timeout-minutes: 15
        env:
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
          SERVER_SHA: ${{ steps.assets.outputs.server_sha256 }}
        run: |
          set -euo pipefail
          digest="${EXISTING_DIGEST:-$BUILT_DIGEST}"
          docker pull --platform "linux/$ARCH" "$IMAGE@$digest"
          archive_sha=$(docker image inspect "$IMAGE@$digest" --format '{{index .Config.Labels "io.aidonia.lore.server-archive.sha256"}}')
          test "$archive_sha" = "$SERVER_SHA"
          uv run --locked python scripts/release/smoke-image.py --image "$IMAGE@$digest" --client "clients/$ARCH/lore"
          mkdir -p digests
          jq -n --arg digest "$digest" '{digest: $digest}' > "digests/$ARCH.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest-${{ matrix.arch }}
          path: digests/*.json
          if-no-files-found: error

  publish:
    needs: [meta, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      TAG: ${{ needs.meta.outputs.tag }}
      VERSION: ${{ needs.meta.outputs.fork_version }}
      SOURCE_COMMIT: ${{ needs.meta.outputs.source_commit }}
      EXISTING_DIGEST: ${{ needs.meta.outputs.existing_digest }}
      IDENTITY_REGEXP: '^https://github\.com/${{ github.repository }}/\.github/workflows/publish-loreserver-image\.yml@refs/(tags/aidonia-v[^/]+|heads/aidonia/main)$'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.meta.outputs.source_commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-digest-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.2
      - name: Assemble, sign, and verify the final image
        id: final
        run: |
          set -euo pipefail
          staging="sha-$SOURCE_COMMIT-v$VERSION"
          if [[ -n "$EXISTING_DIGEST" ]]; then
            digest="$EXISTING_DIGEST"
            test "$(jq -r .digest digests/amd64.json)" = "$digest"
            test "$(jq -r .digest digests/arm64.json)" = "$digest"
          else
            amd64=$(jq -r .digest digests/amd64.json)
            arm64=$(jq -r .digest digests/arm64.json)
            docker buildx imagetools create --annotation "index:org.opencontainers.image.source=https://github.com/$GH_REPO" \
              --annotation "index:org.opencontainers.image.version=$VERSION" \
              --annotation 'index:org.opencontainers.image.description=Aidonia Lore fork server' \
              --tag "$IMAGE:$staging" "$IMAGE@$amd64" "$IMAGE@$arm64"
            digest=$(bash scripts/release/image-digest.sh "$IMAGE:$staging")
            test -n "$digest"
            cosign sign --yes "$IMAGE@$digest"
          fi
          docker buildx imagetools inspect "$IMAGE@$digest" --format '{{json .Manifest}}' > manifest.json
          jq -e '.mediaType == "application/vnd.oci.image.index.v1+json"' manifest.json
          platforms=$(jq -r '[.manifests[] | select(.platform.os != "unknown") | "\(.platform.os)/\(.platform.architecture)"] | sort | join(",")' manifest.json)
          test "$platforms" = linux/amd64,linux/arm64
          cosign verify "$IMAGE@$digest" --certificate-identity-regexp "$IDENTITY_REGEXP" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Assign release tags without replacing an exact version
        env:
          DIGEST: ${{ steps.final.outputs.digest }}
        run: |
          set -euo pipefail
          existing=$(bash scripts/release/image-digest.sh "$IMAGE:$VERSION")
          if [[ -n "$existing" && "$existing" != "$DIGEST" ]]; then
            echo "::error::refusing to replace existing exact version $VERSION"
            exit 1
          fi
          gh api --paginate --slurp 'repos/{owner}/{repo}/releases' > releases.json
          python3 scripts/release/release.py tags --tag "$TAG" --releases releases.json > tags.txt
          while IFS= read -r tag; do
            if [[ "$tag" == "$VERSION" && -n "$existing" ]]; then continue; fi
            docker buildx imagetools create --tag "$IMAGE:$tag" "$IMAGE@$DIGEST"
            test "$(bash scripts/release/image-digest.sh "$IMAGE:$tag")" = "$DIGEST"
          done < tags.txt
      - name: Report the published digest and verification command
        env:
          DIGEST: ${{ steps.final.outputs.digest }}
        run: |
          {
            echo "Published release $TAG from commit $SOURCE_COMMIT."
            echo
            echo "Image: \`$IMAGE@$DIGEST\`"
            echo
            echo '```sh'
            echo "cosign verify '$IMAGE@$DIGEST' --certificate-identity-regexp '$IDENTITY_REGEXP' --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
